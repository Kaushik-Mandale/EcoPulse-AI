# Render Blueprint Specification for CITY_SWAP / EcoPulse AI
# https://render.com/docs/blueprint-spec
# Only this file (render.yaml) is read by Render. render.ecopulse.yaml is unused.

services:
  # --------------------------------------------------
  # Backend API Service (FastAPI + Python)
  # --------------------------------------------------
  - type: web
    name: city-swap-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PROJECT_NAME
        value: "EcoPulse AI"
      - key: ENV
        value: "production"
      - key: CORS_ORIGINS
        value: "https://ecopulse-ai-frontend.onrender.com"
      - key: FRONTEND_URL
        value: "https://ecopulse-ai-frontend.onrender.com"
      - key: PORT
        value: "10000"
      - key: WHATSAPP_PROVIDER
        value: "meta"
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_PHONE
        sync: false
      - key: WHATSAPP_GRAPH_API_VERSION
        value: "v20.0"
      # Set this in Render only if using Twilio (WHATSAPP_PROVIDER=twilio)
      - key: TWILIO_WEBHOOK_URL
        sync: false
      # Cloudflare R2 Object Storage (Set MEDIA_STORAGE_BACKEND to 'r2' for production)
      - key: MEDIA_STORAGE_BACKEND
        value: "supabase"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # Supabase Storage (Set MEDIA_STORAGE_BACKEND to 'supabase' for production)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: "complaint-images"
      - key: SUPABASE_SIGNED_URL_TTL_SECONDS
        value: "900" 

  # --------------------------------------------------
  # Frontend Static Web App (React + Vite)
  # --------------------------------------------------
  - type: web
    name: city-swap-frontend
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://ecopulse-ai-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ecopulse-ai-backend.onrender.com/api


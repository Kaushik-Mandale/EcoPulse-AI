# Render Blueprint Specification for CITY_SWAP
# https://render.com/docs/blueprint-spec

services:
  # --------------------------------------------------
  # Backend API Service (FastAPI + Python)
  # --------------------------------------------------
  - type: web
    name: city-swap-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PROJECT_NAME
        value: "CITY_SWAP API"
      - key: ENV
        value: "production"
      - key: CORS_ORIGINS
        value: "https://city-swap-frontend.onrender.com"
      - key: PORT
        value: "10000"
      - key: WHATSAPP_PROVIDER
        value: "meta"
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

  # --------------------------------------------------
  # Frontend Static Web App (React + Vite)
  # --------------------------------------------------
  - type: web
    name: city-swap-frontend
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://city-swap-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://city-swap-backend.onrender.com/api

